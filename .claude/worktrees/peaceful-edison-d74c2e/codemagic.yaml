# Codemagic CI — builds the iOS app in the cloud (no Mac needed) and uploads
# it to App Store Connect / TestFlight.
#
# One-time setup on codemagic.io (see APPSTORE.md for the walkthrough):
#   1. Sign in with GitHub, add the Shancoh18/brachas-with-rimon repo.
#   2. Teams > Integrations > App Store Connect: add an API key
#      (App Store Connect > Users and Access > Integrations > App Store Connect API).
#   3. In the app's settings enable "iOS automatic code signing" with that key.
# Every push to master then builds and uploads a TestFlight build.

workflows:
  ios-app-store:
    name: iOS App Store build
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rimon # must match the integration name you create
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shancoh.brachaswithrimon
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Build signed IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
